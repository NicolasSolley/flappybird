name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Flappy Bird.xcodeproj" \
            -scheme "Flappy Bird"

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project "Flappy Bird.xcodeproj" \
            -scheme "Flappy Bird" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/Flappy Bird.app"
          test -d "$APP_PATH" || { echo "App not found at $APP_PATH"; exit 1; }
          rm -rf Payload FlappyBird-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload FlappyBird-unsigned.ipa
          ls -lh FlappyBird-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-unsigned
          path: FlappyBird-unsigned.ipa

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FlappyBird-unsigned.ipa
